name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Node.js dependencies
        run: |
          npm run install:all
          npm install --prefix client --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.60.1

      - name: Run server tests
        run: npm run test:server

      - name: Build client
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Validate automation suite collection
        working-directory: automation
        run: |
          python -m pip install -r requirements.txt
          python -m pytest --collect-only -q

  regression:
    name: API and UI regression
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: blind_box_shop
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: blind_box_shop
      DB_USER: root
      DB_PASS: test_password
      DB_SYNC: "false"
      JWT_SECRET: github-actions-test-secret
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CACHE_ENABLED: "true"
      AI_ENABLED: "false"
      AUTOMATION_BASE_URL: http://127.0.0.1:8080
      AUTOMATION_FRONTEND_URL: http://127.0.0.1:3000
      AUTOMATION_DB_HOST: 127.0.0.1
      AUTOMATION_DB_PORT: 3306
      AUTOMATION_DB_NAME: blind_box_shop
      AUTOMATION_DB_USER: root
      AUTOMATION_DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: |
          npm run install:all
          npm install --prefix client --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.60.1
          python -m pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare test data
        run: npm run seed --prefix server

      - name: Start application
        run: |
          npm start --prefix server > server.log 2>&1 &
          npm run dev --prefix client -- --host 127.0.0.1 > client.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:3000

      - name: Run API and UI regression
        working-directory: automation
        run: python -m pytest tests_api tests_ui --alluredir=allure-results --clean-alluredir

      - name: Generate Allure report
        if: always()
        working-directory: automation
        run: npx --yes allure-commandline@2.32.0 generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: automation/allure-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ github.run_number }}
          path: |
            server.log
            client.log
          if-no-files-found: ignore
          retention-days: 7
